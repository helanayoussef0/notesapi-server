services:
  - type: web
    name: notesapi
    env: node
    plan: free
    buildCommand: npm install
    startCommand: NODE_ENV=production node src/app.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: API_URL
        value: https://notesapi-wh1h.onrender.com
      - key: DB_HOST
        value: aws.connect.psdb.cloud
      - key: DB_NAME
        value: notes-api
      - key: DB_USER
        value: bse1vmeyb2z6l9am3qcu
      - key: DB_PASSWORD
        value: pscale_pw_tYXLeuNjC8IpwfclkeAiUy3fKhpIZ9sMCJk5qOfsZuY
      - key: DB_SSL
        value: true
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: LOG_LEVEL
        value: info
      - key: CORS_ORIGIN
        value: "*"
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 100

databases:
  - name: notes-db
    plan: free
    databaseName: notes_api
    user: notes_user