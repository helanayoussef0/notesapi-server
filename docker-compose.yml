version: '3.8'

services:
  app:
    build: .
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=notes_user
      - DB_PASSWORD=notes_password
      - DB_NAME=notes_api
      - JWT_SECRET=your_jwt_secret_change_this_in_production
      - JWT_EXPIRES_IN=24h
    depends_on:
      - db
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - notes-network

  db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_DATABASE=notes_api
      - MYSQL_USER=notes_user
      - MYSQL_PASSWORD=notes_password
    volumes:
      - mysql-data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    restart: unless-stopped
    networks:
      - notes-network

networks:
  notes-network:
    driver: bridge

volumes:
  mysql-data: